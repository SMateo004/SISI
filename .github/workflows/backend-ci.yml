name: backend-ci

on:
  push:
    branches: [main, develop, "feature/**"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  # Corrida manual (p. ej. tras crear el repositorio: el primer push de una rama nueva
  # no evalúa los filtros de paths).
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: lint, test y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: sisi
          POSTGRES_PASSWORD: sisi
          POSTGRES_DB: sisi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sisi -d sisi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: sisi-ci
          RUSTFS_SECRET_KEY: sisi-ci-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fs http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      # Los e2e leen estas variables (ver backend/test/e2e-env.ts).
      E2E_DATABASE_URL: postgresql://sisi:sisi@localhost:5432/sisi_test
      E2E_REDIS_URL: redis://localhost:6379/1
      E2E_STORAGE_ENDPOINT: http://localhost:9000
      E2E_STORAGE_BUCKET: sisi-test
      E2E_STORAGE_ACCESS_KEY: sisi-ci
      E2E_STORAGE_SECRET_KEY: sisi-ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (incluye prisma generate)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: Crear bucket de pruebas en RustFS
        env:
          AWS_ACCESS_KEY_ID: sisi-ci
          AWS_SECRET_ACCESS_KEY: sisi-ci-secret
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url "$E2E_STORAGE_ENDPOINT" s3api create-bucket --bucket "$E2E_STORAGE_BUCKET"

      - name: Tests e2e (Postgres+PostGIS, Redis y S3)
        run: npm run test:e2e

      - name: Build
        run: npm run build
