# Render Blueprint de SISI: PRODUCCIÓN (rama main; docs/02 §8, ADR-0007, ADR-0046).
# Staging está en render.staging.yaml (otro Blueprint, otro proyecto).
# Sin secretos: los valores externos se piden en el dashboard (sync: false)
# y los JWT se generan solos (generateValue: true).
#
# Nombres: api, worker, billing-cron, db y cache (staging lleva sufijo -staging).

projects:
  - name: sisi
    environments:
      # ──────────────────────────── PRODUCTION ───────────────────────────
      # Planes pagos: un servicio inmediato no tolera arranques en frío (doc 02 §8).
      # Despliegue solo desde deploy-production (tag vX.Y.Z en main, con aprobación, ADR-0046):
      # autoDeployTrigger: off en api, worker y billing-cron; el workflow llama a sus deploy hooks
      # con el commit del tag. La migración corre en el preDeploy de la API y siempre es
      # compatible hacia atrás (expandir y luego contraer): el worker y el cron viejos siguen
      # funcionando hasta que se despliegan.
      - name: production
        envVarGroups:
          - name: sisi-production-shared
            envVars:
              - key: NODE_ENV
                value: production
              - key: APP_ENV
                value: production
              - key: OTP_PROVIDER
                value: bird
              - key: GEOCODING_PROVIDER
                value: google
              # Exige FIREBASE_SERVICE_ACCOUNT en api y worker (ADR-0027).
              - key: PUSH_PROVIDER
                value: fcm
              - key: NODE_VERSION
                value: "24"
              - key: TZ_DEFAULT
                value: America/La_Paz
              # URLs firmadas de vida corta (ADR-0047): producción no arranca con más de 900 s.
              - key: AVATAR_URL_TTL_SEC
                value: "900"
              - key: REQUEST_PHOTO_URL_TTL_SEC
                value: "900"
              - key: JWT_SECRET
                generateValue: true
              - key: JWT_REFRESH_SECRET
                generateValue: true

        services:
          - type: web
            name: api
            runtime: node
            region: virginia
            plan: standard
            branch: main
            rootDir: backend
            buildCommand: npm ci --include=dev && npm run build
            preDeployCommand: npx prisma migrate deploy && npm run prisma:seed
            startCommand: npm run start:prod
            healthCheckPath: /health
            autoDeployTrigger: off # despliega deploy-production (ADR-0046)
            envVars:
              - fromGroup: sisi-production-shared
              - key: DATABASE_URL
                fromDatabase:
                  name: db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: cache
                  property: connectionString
              # Solo https y sin comodines: la API no arranca si no (ADR-0047). Sin dominio propio:
              # https://app-web.vercel.app,https://admin.vercel.app (URLs reales de Vercel).
              - key: CORS_ORIGINS
                sync: false
              - key: OTP_PROVIDER_KEY
                sync: false
              - key: OTP_SENDER
                sync: false
              - key: FIREBASE_SERVICE_ACCOUNT
                sync: false
              - key: STORAGE_ENDPOINT # R2: https://<account_id>.r2.cloudflarestorage.com
                sync: false
              - key: STORAGE_REGION
                value: auto
              - key: STORAGE_BUCKET
                sync: false
              - key: STORAGE_ACCESS_KEY
                sync: false
              - key: STORAGE_SECRET_KEY
                sync: false
              - key: MAPS_API_KEY # llave de SERVIDOR (Geocoding API), distinta de la de la app
                sync: false
              - key: ADMIN_TOTP_SECRET # ingreso al panel (ADR-0055): dev-tools admin-totp
                sync: false
              - key: SENTRY_DSN
                sync: false

          - type: worker
            name: worker
            runtime: node
            region: virginia
            plan: starter
            branch: main
            rootDir: backend
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm run start:worker
            autoDeployTrigger: off # despliega deploy-production (ADR-0046)
            envVars:
              - fromGroup: sisi-production-shared
              - key: DATABASE_URL
                fromDatabase:
                  name: db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: cache
                  property: connectionString
              # Borra archivos de cuentas eliminadas y de la retención (ADR-0049, ADR-0050).
              - key: STORAGE_ENDPOINT
                sync: false
              - key: STORAGE_REGION
                value: auto
              - key: STORAGE_BUCKET
                sync: false
              - key: STORAGE_ACCESS_KEY
                sync: false
              - key: STORAGE_SECRET_KEY
                sync: false
              - key: FIREBASE_SERVICE_ACCOUNT
                sync: false
              - key: SENTRY_DSN
                sync: false

          - type: cron
            name: billing-cron
            runtime: node
            region: virginia
            plan: starter
            branch: main
            rootDir: backend
            # Puesta al día de cobros cada hora (ADR-0036): cierra los periodos cuyo fin ya pasó
            # (corte del domingo 23:59 local), vence los impagos y programa avisos. Idempotente:
            # una corrida fallida se recupera en la siguiente. Render interpreta el cron en UTC;
            # los límites del negocio se calculan en la zona de cada ciudad, no aquí.
            schedule: "5 * * * *"
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm run start:billing-cron
            autoDeployTrigger: off # despliega deploy-production (ADR-0046)
            envVars:
              - fromGroup: sisi-production-shared
              - key: DATABASE_URL
                fromDatabase:
                  name: db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: cache
                  property: connectionString
              - key: SENTRY_DSN
                sync: false

          - type: keyvalue
            name: cache
            region: virginia
            # Plan pago: con persistencia (journal + snapshot); el free no persiste.
            plan: 256mb
            # Obligatorio para colas BullMQ: nunca descartar claves.
            maxmemoryPolicy: noeviction
            ipAllowList: [] # solo red privada de Render

        databases:
          - name: db
            databaseName: sisi
            user: sisi
            region: virginia
            # Backups: recuperación a un punto en el tiempo (3 días en workspace Hobby, 7 en Pro) y
            # exportes lógicos de 7 días. Restaurar crea una base nueva (docs/runbook.md).
            plan: basic-1gb
            postgresMajorVersion: "17"
            ipAllowList: [] # solo red privada de Render
