name: deploy-web

# Flutter web → Vercel (ADR-0006, ADR-0039, ADR-0046).
#   develop → proyectos de staging (app-web-staging, admin-staging), en cada push
#   producción → solo desde deploy-production (tag vX.Y.Z en main, con aprobación), que llama a
#                este workflow con environment=production. Un push a main no despliega.
# Los dos ambientes despliegan con --prod a su propio proyecto: así cada uno tiene una URL
# .vercel.app fija (las previews cambian de URL en cada deploy y CORS_ORIGINS necesita orígenes fijos).
# Requiere GitHub Environments "staging" y "production" con:
#   (el admin compila con API_URL=/api: el proxy de Vercel lleva /api/* a la API, ADR-0040)
#   vars:    API_URL, SOCKET_URL, MAPS_API_KEY_WEB (llave de Maps de la app web, restringida por dominio),
#            FIREBASE_API_KEY_WEB, FIREBASE_APP_ID_WEB, FIREBASE_SENDER_ID, FIREBASE_PROJECT_ID,
#            FIREBASE_VAPID_KEY (configuración pública de Firebase para el push web, ADR-0027)
#   secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_APP_WEB, VERCEL_PROJECT_ID_ADMIN
#            (en cada Environment, los ids de SUS proyectos: staging ≠ production)

on:
  push:
    branches: [develop]
    paths: ["apps/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch: # staging a mano
  workflow_call:
    # Los secretos de Vercel salen del Environment del job (production), no del que llama.
    inputs:
      environment:
        type: string
        required: true

concurrency:
  group: deploy-web-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  deploy:
    name: ${{ matrix.project }} (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'staging' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: app-web
            path: apps/mobile
            project_id_secret: VERCEL_PROJECT_ID_APP_WEB
          - project: admin
            path: apps/admin
            project_id_secret: VERCEL_PROJECT_ID_ADMIN
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    env:
      APP_ENV: ${{ inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build web
        run: >-
          flutter build web --release
          --dart-define=API_URL=${{ matrix.project == 'admin' && '/api' || vars.API_URL }}
          --dart-define=SOCKET_URL=${{ vars.SOCKET_URL }}
          --dart-define=APP_ENV=${{ env.APP_ENV }}
          --dart-define=MAPS_API_KEY=${{ vars.MAPS_API_KEY_WEB }}
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY_WEB }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID_WEB }}
          --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_VAPID_KEY=${{ vars.FIREBASE_VAPID_KEY }}

      # El service worker del push web (firebase-messaging-sw.js) lee esta configuración.
      - name: Configuración de Firebase para el service worker
        if: matrix.project == 'app-web'
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY_WEB }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID_WEB }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: >-
          node -e "const e=process.env;require('fs').writeFileSync('build/web/firebase-config.js',
          'self.FIREBASE_CONFIG='+JSON.stringify({apiKey:e.FIREBASE_API_KEY,appId:e.FIREBASE_APP_ID,
          messagingSenderId:e.FIREBASE_SENDER_ID,projectId:e.FIREBASE_PROJECT_ID})+';')"

      # El admin llama a la API por su propio origen (/api/* → API_URL) para que la cookie
      # httpOnly del refresh sea de primera parte (ADR-0040). El socket va directo a SOCKET_URL.
      - name: Proxy /api del admin
        if: matrix.project == 'admin'
        env:
          API_URL: ${{ vars.API_URL }}
        run: node tool/vercel-json.mjs

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Vercel CLI
        run: npm install --global vercel@63.1.2

      # Los secretos de Vercel solo existen en este paso (no los ven acciones de terceros).
      - name: Vercel pull, build y deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          # Empaqueta build/web aplicando vercel.json (rewrites a index.html y, en el admin, /api).
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          # La URL fija es la del proyecto (<proyecto>.vercel.app); $url es la del deployment.
          echo "Desplegado en: $url"
          echo "### ${{ matrix.project }} ($APP_ENV) → $url" >> "$GITHUB_STEP_SUMMARY"
