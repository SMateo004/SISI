name: mobile-release

# Esqueleto: compila APK y AAB de apps/mobile apuntando a la API de producción.
# Pendiente (docs/pendientes.md): firma de release con keystore desde secretos
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
# y publicación en Google Play / build de iOS en macOS.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # TODO(firma): decodificar el keystore y crear android/key.properties antes de compilar.

      - name: Build APK
        run: >-
          flutter build apk --release
          --dart-define=API_URL=${{ vars.API_URL }}
          --dart-define=SOCKET_URL=${{ vars.SOCKET_URL }}
          --dart-define=APP_ENV=production

      - name: Build AAB
        run: >-
          flutter build appbundle --release
          --dart-define=API_URL=${{ vars.API_URL }}
          --dart-define=SOCKET_URL=${{ vars.SOCKET_URL }}
          --dart-define=APP_ENV=production

      - uses: actions/upload-artifact@v4
        with:
          name: sisi-android-${{ github.ref_name }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
