name: mobile-release

# Android para Google Play (ADR-0054): AAB firmado con la upload key para la pista de pruebas
# internas (y APK firmado para instalar a mano en la prueba de campo).
#   - Tag vX.Y.Z sobre main (igual que deploy-production) o a mano (workflow_dispatch).
#   - Falla si los textos legales siguen siendo borradores (ADR-0051), si la versión no coincide
#     con el tag o si falta la upload key: nunca se construye un release firmado con debug.
#   - La primera subida a Play Console es manual (Play App Signing se activa ahí). docs/runbook.md.
#
# Environment "production":
#   secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#            ANDROID_KEY_PASSWORD, MAPS_API_KEY_ANDROID
#   vars:    API_URL, SOCKET_URL, FIREBASE_API_KEY_ANDROID, FIREBASE_APP_ID_ANDROID,
#            FIREBASE_SENDER_ID, FIREBASE_PROJECT_ID, SENTRY_DSN_MOBILE,
#            ANDROID_APP_ID (identificador final en Play), APP_NAME (nombre comercial)

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  android:
    name: Android (AAB + APK firmados)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Llave de Maps de Android (restringida a paquete + SHA-1); Gradle la pone en el manifiesto.
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_ANDROID }}
      # Gradle lee ORG_GRADLE_PROJECT_X como la propiedad -PX (build.gradle.kts).
      ORG_GRADLE_PROJECT_APP_ID: ${{ vars.ANDROID_APP_ID }}
      ORG_GRADLE_PROJECT_APP_NAME: ${{ vars.APP_NAME }}
      SISI_REQUIRE_RELEASE_SIGNING: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Un tag solo publica desde main
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME no está en main"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Textos legales finales y versión
        working-directory: .
        run: |
          node tools/check-legal.mjs
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node tools/bump-version.mjs --check "$GITHUB_REF_NAME"
          else
            node tools/bump-version.mjs --check
          fi

      - name: Versión y build del pubspec
        id: version
        run: |
          v=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//')
          echo "name=${v%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${v##*+}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # La upload key solo existe en este job, en un archivo temporal fuera del repositorio.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Falta ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build AAB y APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          defines=(
            --build-name=${{ steps.version.outputs.name }}
            --build-number=${{ steps.version.outputs.build }}
            --dart-define=API_URL=${{ vars.API_URL }}
            --dart-define=SOCKET_URL=${{ vars.SOCKET_URL }}
            --dart-define=APP_ENV=production
            --dart-define=APP_VERSION=${{ steps.version.outputs.name }}
            --dart-define=APP_BUILD=${{ steps.version.outputs.build }}
            --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN_MOBILE }}
            --dart-define=MAPS_API_KEY=${{ secrets.MAPS_API_KEY_ANDROID }}
            --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY_ANDROID }}
            --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID_ANDROID }}
            --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
            --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          )
          flutter build appbundle --release "${defines[@]}"
          flutter build apk --release "${defines[@]}"

      - name: Firma con la upload key (no la de debug)
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          if echo "$certs" | grep -q "Android Debug"; then
            echo "::error::El APK quedó firmado con la llave de debug"; exit 1
          fi
          echo "$certs" | grep -E "DN|SHA-1|SHA-256" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: sisi-android-${{ steps.version.outputs.name }}+${{ steps.version.outputs.build }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
